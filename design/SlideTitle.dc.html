<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #070c11; color: #e7ecef; }
    a { color: #1ed760; } a:hover { color: #6EE7A0; }
  </style>
</helmet>

<!-- 16:9 slide = 1280×720 -->
<div style="width:1280px; height:720px; background:#070c11; position:relative; overflow:hidden; display:flex;">

  <!-- Background glows -->
  <div style="position:absolute; inset:0; pointer-events:none; background:radial-gradient(55% 70% at 75% 50%, rgba(30,215,96,0.12), transparent 70%), radial-gradient(40% 50% at 10% 80%, rgba(196,241,53,0.07), transparent 70%);"></div>

  <!-- Grid dots -->
  <div style="position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px); background-size:28px 28px;"></div>

  <!-- Left content column -->
  <div style="position:relative; z-index:2; flex:1; display:flex; flex-direction:column; justify-content:center; padding:72px 64px; gap:0;">

    <!-- Eyebrow -->
    <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; color:#1ed760; text-transform:uppercase; margin-bottom:20px;">Midwest Dataworks · 2026</div>

    <!-- Headline -->
    <div style="font-family:'Space Grotesk',sans-serif; font-size:52px; font-weight:700; color:#e7ecef; letter-spacing:-1.5px; line-height:1.1; margin-bottom:24px;">
      Healthcare Data,<br>
      <span style="background:linear-gradient(90deg, #1ed760, #C4F135); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">Modernized.</span>
    </div>

    <!-- Rule -->
    <div style="width:56px; height:3px; background:linear-gradient(90deg, #1ed760, #C4F135); border-radius:2px; margin-bottom:24px;"></div>

    <!-- Subtitle -->
    <div style="font-family:'IBM Plex Sans',sans-serif; font-size:17px; font-weight:400; color:#a9b6bd; line-height:1.6; max-width:420px;">
      Better data. Healthier patients. Stronger care.<br>Azure · Databricks · Epic Clarity
    </div>

    <!-- Presenter -->
    <div style="margin-top:40px; display:flex; align-items:center; gap:14px;">
      <div style="width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#6EE7A0,#1ed760); display:flex; align-items:center; justify-content:center; flex:none;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="20" height="20" fill="none">
          <defs><linearGradient id="slideTitleMark" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#06110f"/><stop offset="1" stop-color="#06110f"/></linearGradient></defs>
          <g stroke="#06110f" stroke-width="8" stroke-linecap="round">
            <line x1="68" y1="46.1" x2="81.5" y2="22.8"/><line x1="49.9" y1="47.6" x2="39" y2="34.2"/>
            <line x1="75.9" y1="61.3" x2="100" y2="63.3"/><line x1="47.3" y1="69.7" x2="32.4" y2="81.1"/>
            <line x1="61.4" y1="75.9" x2="63.3" y2="98"/>
          </g>
          <circle cx="60" cy="60" r="16" stroke="#06110f" stroke-width="8"/>
          <circle cx="86" cy="15" r="9" stroke="#06110f" stroke-width="8"/>
          <circle cx="34" cy="28" r="8" stroke="#06110f" stroke-width="8"/>
          <circle cx="108" cy="64" r="8" stroke="#06110f" stroke-width="8"/>
          <circle cx="26" cy="86" r="8" stroke="#06110f" stroke-width="8"/>
          <circle cx="64" cy="106" r="8" stroke="#06110f" stroke-width="8"/>
        </svg>
      </div>
      <div>
        <div style="font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; color:#e7ecef;">Josh Adkins</div>
        <div style="font-family:'IBM Plex Sans',sans-serif; font-size:12px; color:#79878d;">Midwest Dataworks</div>
      </div>
    </div>
  </div>

  <!-- Right: large logo mark -->
  <div style="position:relative; z-index:2; width:380px; display:flex; align-items:center; justify-content:center; flex:none;">
    <div style="position:relative;">
      <!-- Glow behind mark -->
      <div style="position:absolute; inset:-40px; border-radius:50%; background:radial-gradient(circle, rgba(30,215,96,0.18), transparent 70%);"></div>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="180" height="180" fill="none" style="position:relative; z-index:1;">
        <defs>
          <linearGradient id="slideTitleLg" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#6EE7A0"/>
            <stop offset="1" stop-color="#C4F135"/>
          </linearGradient>
        </defs>
        <g stroke="url(#slideTitleLg)" stroke-width="6" stroke-linecap="round">
          <line x1="68" y1="46.1" x2="81.5" y2="22.8"/>
          <line x1="49.9" y1="47.6" x2="39" y2="34.2"/>
          <line x1="75.9" y1="61.3" x2="100" y2="63.3"/>
          <line x1="47.3" y1="69.7" x2="32.4" y2="81.1"/>
          <line x1="61.4" y1="75.9" x2="63.3" y2="98"/>
        </g>
        <circle cx="60" cy="60" r="16" stroke="url(#slideTitleLg)" stroke-width="6"/>
        <circle cx="86" cy="15" r="9" stroke="url(#slideTitleLg)" stroke-width="6"/>
        <circle cx="34" cy="28" r="8" stroke="url(#slideTitleLg)" stroke-width="6"/>
        <circle cx="108" cy="64" r="8" stroke="url(#slideTitleLg)" stroke-width="6"/>
        <circle cx="26" cy="86" r="8" stroke="url(#slideTitleLg)" stroke-width="6"/>
        <circle cx="64" cy="106" r="8" stroke="url(#slideTitleLg)" stroke-width="6"/>
      </svg>
    </div>
  </div>

  <!-- Bottom bar -->
  <div style="position:absolute; bottom:0; left:0; right:0; height:4px; background:linear-gradient(90deg, #1ed760, #6EE7A0, #C4F135);"></div>
</div>
</x-dc>
</body>
</html>
