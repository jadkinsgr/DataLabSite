<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #f0f0f0; color: #111; }
    a { color: #0d6efd; text-decoration: none; }
    a:hover { color: #0a58ca; text-decoration: underline; }
  </style>
</helmet>

<!-- Outer artboard: light bg to simulate email client -->
<div style="width:900px; height:640px; background:#f4f4f5; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:40px; padding:48px;">

  <!-- Label -->
  <div style="font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:600; letter-spacing:0.1em; color:#9ca3af; text-transform:uppercase; align-self:flex-start;">Email Signature Preview</div>

  <!-- Email chrome mock -->
  <div style="background:#ffffff; border-radius:8px; box-shadow:0 2px 16px rgba(0,0,0,0.1); overflow:hidden; width:100%; max-width:640px; align-self:flex-start;">

    <!-- Thin top bar -->
    <div style="background:#f9fafb; border-bottom:1px solid #e5e7eb; padding:10px 18px; display:flex; gap:6px; align-items:center;">
      <div style="width:10px; height:10px; border-radius:50%; background:#f87171;"></div>
      <div style="width:10px; height:10px; border-radius:50%; background:#fbbf24;"></div>
      <div style="width:10px; height:10px; border-radius:50%; background:#34d399;"></div>
    </div>

    <!-- Email body area -->
    <div style="padding:24px 28px 28px;">

      <!-- Email dash separator like real clients -->
      <div style="font-family:'IBM Plex Sans',sans-serif; font-size:13px; color:#6b7280; margin-bottom:10px;">--</div>

      <!-- Signature card -->
      <div style="display:flex; flex-direction:column; gap:0; font-family:'IBM Plex Sans',sans-serif;">

        <!-- Banner: brand header bar -->
        <div style="width:380px; height:52px; border-radius:6px 6px 0 0; overflow:hidden; position:relative; background:linear-gradient(110deg, #0b1e26 0%, #0f3040 40%, #1a4a3a 70%, #2d6a4f 85%, #C4F135 100%);">

          <!-- Network graph overlay (SVG) -->
          <svg style="position:absolute; inset:0; width:100%; height:100%; opacity:0.55;" viewBox="0 0 380 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Lines -->
            <line x1="30" y1="26" x2="80" y2="14" stroke="#6EE7A0" stroke-width="1" stroke-opacity="0.7"/>
            <line x1="80" y1="14" x2="140" y2="32" stroke="#6EE7A0" stroke-width="1" stroke-opacity="0.7"/>
            <line x1="140" y1="32" x2="190" y2="12" stroke="#6EE7A0" stroke-width="1" stroke-opacity="0.5"/>
            <line x1="190" y1="12" x2="240" y2="30" stroke="#C4F135" stroke-width="1" stroke-opacity="0.5"/>
            <line x1="240" y1="30" x2="300" y2="18" stroke="#C4F135" stroke-width="1" stroke-opacity="0.6"/>
            <line x1="300" y1="18" x2="350" y2="36" stroke="#C4F135" stroke-width="1" stroke-opacity="0.4"/>
            <line x1="80" y1="14" x2="120" y2="44" stroke="#6EE7A0" stroke-width="1" stroke-opacity="0.3"/>
            <line x1="140" y1="32" x2="170" y2="46" stroke="#6EE7A0" stroke-width="1" stroke-opacity="0.3"/>
            <line x1="240" y1="30" x2="270" y2="48" stroke="#C4F135" stroke-width="1" stroke-opacity="0.3"/>
            <!-- Nodes -->
            <circle cx="30"  cy="26" r="2.5" fill="#6EE7A0" opacity="0.8"/>
            <circle cx="80"  cy="14" r="3"   fill="#6EE7A0" opacity="0.9"/>
            <circle cx="120" cy="44" r="2"   fill="#6EE7A0" opacity="0.5"/>
            <circle cx="140" cy="32" r="3"   fill="#6EE7A0" opacity="0.7"/>
            <circle cx="170" cy="46" r="2"   fill="#6EE7A0" opacity="0.4"/>
            <circle cx="190" cy="12" r="2.5" fill="#C4F135" opacity="0.6"/>
            <circle cx="240" cy="30" r="3"   fill="#C4F135" opacity="0.8"/>
            <circle cx="270" cy="48" r="2"   fill="#C4F135" opacity="0.4"/>
            <circle cx="300" cy="18" r="3"   fill="#C4F135" opacity="0.7"/>
            <circle cx="350" cy="36" r="2.5" fill="#C4F135" opacity="0.6"/>
          </svg>

          <!-- Logo mark small -->
          <div style="position:absolute; right:14px; top:50%; transform:translateY(-50%);">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="30" height="30" fill="none">
              <defs>
                <linearGradient id="sigMark" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#6EE7A0"/>
                  <stop offset="1" stop-color="#C4F135"/>
                </linearGradient>
              </defs>
              <g stroke="url(#sigMark)" stroke-width="7" stroke-linecap="round">
                <line x1="68" y1="46.1" x2="81.5" y2="22.8"/>
                <line x1="49.9" y1="47.6" x2="39" y2="34.2"/>
                <line x1="75.9" y1="61.3" x2="100" y2="63.3"/>
                <line x1="47.3" y1="69.7" x2="32.4" y2="81.1"/>
                <line x1="61.4" y1="75.9" x2="63.3" y2="98"/>
              </g>
              <circle cx="60" cy="60" r="16" stroke="url(#sigMark)" stroke-width="7"/>
              <circle cx="86" cy="15" r="9"  stroke="url(#sigMark)" stroke-width="7"/>
              <circle cx="34" cy="28" r="8"  stroke="url(#sigMark)" stroke-width="7"/>
              <circle cx="108" cy="64" r="8" stroke="url(#sigMark)" stroke-width="7"/>
              <circle cx="26" cy="86" r="8"  stroke="url(#sigMark)" stroke-width="7"/>
              <circle cx="64" cy="106" r="8" stroke="url(#sigMark)" stroke-width="7"/>
            </svg>
          </div>
        </div>

        <!-- Info block -->
        <div style="width:380px; padding:14px 16px 16px; border:1px solid #e5e7eb; border-top:none; border-radius:0 0 6px 6px; background:#ffffff;">
          <div style="display:flex; flex-direction:column; gap:3px;">
            <div style="font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:700; color:#111827; line-height:1.3;">
              Josh Adkins <span style="font-weight:400; font-size:12px; color:#6b7280;">(he/him)</span>
            </div>
            <div style="font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; font-weight:600; color:#374151;">Data Lab</div>
            <div style="font-family:'IBM Plex Sans',sans-serif; font-size:11.5px; color:#6b7280; margin-top:1px;">Healthcare Data Modernization · Grand Rapids, MI</div>
            <div style="margin-top:6px; display:flex; flex-direction:column; gap:2px;">
              <a href="mailto:midatalabco@gmail.com" style="font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#1d6f42;">midatalabco@gmail.com</a>
              <a href="https://midatalab.net" style="font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#1d6f42;">midatalab.net</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Alternate: dark version -->
  <div style="display:flex; flex-direction:column; gap:8px; align-self:flex-start; width:100%;">
    <div style="font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:600; letter-spacing:0.1em; color:#9ca3af; text-transform:uppercase;">Dark / Brand Version</div>

    <div style="background:#070c11; border-radius:8px; border:1px solid rgba(255,255,255,0.08); overflow:hidden; width:380px;">

      <!-- Banner -->
      <div style="width:380px; height:52px; position:relative; background:linear-gradient(110deg, #0b1e26 0%, #0f3040 40%, #1a4a3a 70%, #2d6a4f 85%, #C4F135 100%);">
        <svg style="position:absolute; inset:0; width:100%; height:100%; opacity:0.55;" viewBox="0 0 380 52" fill="none">
          <line x1="30" y1="26" x2="80" y2="14" stroke="#6EE7A0" stroke-width="1" stroke-opacity="0.7"/>
          <line x1="80" y1="14" x2="140" y2="32" stroke="#6EE7A0" stroke-width="1" stroke-opacity="0.7"/>
          <line x1="140" y1="32" x2="190" y2="12" stroke="#6EE7A0" stroke-width="1" stroke-opacity="0.5"/>
          <line x1="190" y1="12" x2="240" y2="30" stroke="#C4F135" stroke-width="1" stroke-opacity="0.5"/>
          <line x1="240" y1="30" x2="300" y2="18" stroke="#C4F135" stroke-width="1" stroke-opacity="0.6"/>
          <line x1="300" y1="18" x2="350" y2="36" stroke="#C4F135" stroke-width="1" stroke-opacity="0.4"/>
          <circle cx="30" cy="26" r="2.5" fill="#6EE7A0" opacity="0.8"/>
          <circle cx="80" cy="14" r="3" fill="#6EE7A0" opacity="0.9"/>
          <circle cx="140" cy="32" r="3" fill="#6EE7A0" opacity="0.7"/>
          <circle cx="190" cy="12" r="2.5" fill="#C4F135" opacity="0.6"/>
          <circle cx="240" cy="30" r="3" fill="#C4F135" opacity="0.8"/>
          <circle cx="300" cy="18" r="3" fill="#C4F135" opacity="0.7"/>
          <circle cx="350" cy="36" r="2.5" fill="#C4F135" opacity="0.6"/>
        </svg>
        <div style="position:absolute; right:14px; top:50%; transform:translateY(-50%);">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="30" height="30" fill="none">
            <defs><linearGradient id="sigMark2" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6EE7A0"/><stop offset="1" stop-color="#C4F135"/></linearGradient></defs>
            <g stroke="url(#sigMark2)" stroke-width="7" stroke-linecap="round">
              <line x1="68" y1="46.1" x2="81.5" y2="22.8"/><line x1="49.9" y1="47.6" x2="39" y2="34.2"/>
              <line x1="75.9" y1="61.3" x2="100" y2="63.3"/><line x1="47.3" y1="69.7" x2="32.4" y2="81.1"/>
              <line x1="61.4" y1="75.9" x2="63.3" y2="98"/>
            </g>
            <circle cx="60" cy="60" r="16" stroke="url(#sigMark2)" stroke-width="7"/>
            <circle cx="86" cy="15" r="9" stroke="url(#sigMark2)" stroke-width="7"/>
            <circle cx="34" cy="28" r="8" stroke="url(#sigMark2)" stroke-width="7"/>
            <circle cx="108" cy="64" r="8" stroke="url(#sigMark2)" stroke-width="7"/>
            <circle cx="26" cy="86" r="8" stroke="url(#sigMark2)" stroke-width="7"/>
            <circle cx="64" cy="106" r="8" stroke="url(#sigMark2)" stroke-width="7"/>
          </svg>
        </div>
      </div>

      <!-- Info block dark -->
      <div style="padding:14px 16px 16px;">
        <div style="display:flex; flex-direction:column; gap:3px;">
          <div style="font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:700; color:#e7ecef;">
            Josh Adkins <span style="font-weight:400; font-size:12px; color:#79878d;">(he/him)</span>
          </div>
          <div style="font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; font-weight:600; color:#cdd6da;">Data Lab</div>
          <div style="font-family:'IBM Plex Sans',sans-serif; font-size:11.5px; color:#5b6a70; margin-top:1px;">Healthcare Data Modernization · Grand Rapids, MI</div>
          <div style="margin-top:6px; display:flex; flex-direction:column; gap:2px;">
            <a href="mailto:midatalabco@gmail.com" style="font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#1ed760;">midatalabco@gmail.com</a>
            <a href="https://midatalab.net" style="font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#6EE7A0;">midatalab.net</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
